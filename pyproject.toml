[project]
name = "svclosure"
version = "0.1.0"
description = "CMS displaced-SV FullSim/FastSim signal-yield closure study (LLPCombine bins)"
requires-python = ">=3.12"
dependencies = [
  "uproot>=5.7",
  "awkward>=2.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "mplhep>=0.3.50",
  "fsspec-xrootd>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
svclosure = "svclosure.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svclosure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["remote: needs XRootD access to cmseos.fnal.gov (deselect with -m 'not remote')"]
